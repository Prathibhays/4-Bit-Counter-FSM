<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="500" viewBox="0 0 1000 500">
  <rect width="100%" height="100%" fill="white"/>
  <text x="500" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">4-Bit Counter Datapath: 2:1 MUX + D Flip-Flops</text>

  <rect x="90" y="105" width="190" height="75" rx="8" fill="#eef2ff" stroke="#222" stroke-width="2"/>
  <text x="185" y="135" text-anchor="middle" font-family="Arial" font-size="18">4-bit Adder</text>
  <text x="185" y="160" text-anchor="middle" font-family="Arial" font-size="17">count + 0001</text>

  <rect x="90" y="300" width="190" height="75" rx="8" fill="#eef2ff" stroke="#222" stroke-width="2"/>
  <text x="185" y="330" text-anchor="middle" font-family="Arial" font-size="18">Current Count</text>
  <text x="185" y="355" text-anchor="middle" font-family="Arial" font-size="17">count[3:0]</text>

  <polygon points="400,130 400,350 520,300 520,180" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="455" y="235" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">2:1</text>
  <text x="455" y="262" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">MUX</text>
  <text x="415" y="150" font-family="Arial" font-size="14">1</text>
  <text x="415" y="335" font-family="Arial" font-size="14">0</text>

  <rect x="660" y="170" width="220" height="145" rx="8" fill="#ecfdf5" stroke="#222" stroke-width="2"/>
  <text x="770" y="205" text-anchor="middle" font-family="Arial" font-size="20" font-weight="bold">4 D Flip-Flops</text>
  <text x="770" y="238" text-anchor="middle" font-family="Arial" font-size="17">D3 D2 D1 D0</text>
  <text x="770" y="268" text-anchor="middle" font-family="Arial" font-size="17">Q3 Q2 Q1 Q0</text>
  <text x="770" y="295" text-anchor="middle" font-family="Arial" font-size="15">Synchronous Reset</text>

  <line x1="280" y1="142" x2="400" y2="142" stroke="#222" stroke-width="3"/>
  <polygon points="392,136 405,142 392,148" fill="#222"/>
  <text x="335" y="132" text-anchor="middle" font-family="Arial" font-size="15">count + 1</text>

  <line x1="280" y1="338" x2="400" y2="338" stroke="#222" stroke-width="3"/>
  <polygon points="392,332 405,338 392,344" fill="#222"/>
  <text x="335" y="328" text-anchor="middle" font-family="Arial" font-size="15">count</text>

  <line x1="520" y1="240" x2="660" y2="240" stroke="#222" stroke-width="3"/>
  <polygon points="652,234 665,240 652,246" fill="#222"/>
  <text x="590" y="228" text-anchor="middle" font-family="Arial" font-size="15">next_count</text>

  <line x1="455" y1="410" x2="455" y2="300" stroke="#222" stroke-width="3"/>
  <polygon points="449,308 455,295 461,308" fill="#222"/>
  <text x="455" y="440" text-anchor="middle" font-family="Arial" font-size="18">run</text>
  <text x="455" y="463" text-anchor="middle" font-family="Arial" font-size="14">0 = HOLD, 1 = RUN</text>

  <line x1="770" y1="315" x2="770" y2="390" stroke="#222" stroke-width="3"/>
  <line x1="770" y1="390" x2="185" y2="390" stroke="#222" stroke-width="3"/>
  <line x1="185" y1="390" x2="185" y2="375" stroke="#222" stroke-width="3"/>
  <polygon points="179,382 185,395 191,382" fill="#222"/>
  <text x="770" y="410" text-anchor="middle" font-family="Arial" font-size="15">count[3:0] feedback</text>

  <text x="50" y="490" font-family="Arial" font-size="14">MUX select: run | 0 → count | 1 → count + 1</text>
</svg>
