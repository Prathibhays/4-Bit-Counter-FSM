<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520">
  <rect width="100%" height="100%" fill="white"/>
  <text x="450" y="35" text-anchor="middle" font-family="Arial" font-size="24" font-weight="bold">Four D Flip-Flops for the 4-Bit Counter</text>

  <!-- FF0 -->
  <rect x="330" y="75" width="240" height="70" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="450" y="105" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">D Flip-Flop 0</text>
  <text x="450" y="128" text-anchor="middle" font-family="Arial" font-size="15">D0 → Q0</text>
  <text x="280" y="112" text-anchor="middle" font-family="Arial" font-size="15">D0</text>
  <line x1="300" y1="110" x2="330" y2="110" stroke="#222" stroke-width="2"/>
  <polygon points="322,104 335,110 322,116" fill="#222"/>
  <line x1="570" y1="110" x2="650" y2="110" stroke="#222" stroke-width="2"/>
  <polygon points="642,104 655,110 642,116" fill="#222"/>
  <text x="680" y="115" font-family="Arial" font-size="15">Q0</text>

  <!-- FF1 -->
  <rect x="330" y="175" width="240" height="70" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="450" y="205" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">D Flip-Flop 1</text>
  <text x="450" y="228" text-anchor="middle" font-family="Arial" font-size="15">D1 → Q1</text>
  <text x="280" y="212" text-anchor="middle" font-family="Arial" font-size="15">D1</text>
  <line x1="300" y1="210" x2="330" y2="210" stroke="#222" stroke-width="2"/>
  <polygon points="322,204 335,210 322,216" fill="#222"/>
  <line x1="570" y1="210" x2="650" y2="210" stroke="#222" stroke-width="2"/>
  <polygon points="642,204 655,210 642,216" fill="#222"/>
  <text x="680" y="215" font-family="Arial" font-size="15">Q1</text>

  <!-- FF2 -->
  <rect x="330" y="275" width="240" height="70" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="450" y="305" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">D Flip-Flop 2</text>
  <text x="450" y="328" text-anchor="middle" font-family="Arial" font-size="15">D2 → Q2</text>
  <text x="280" y="312" text-anchor="middle" font-family="Arial" font-size="15">D2</text>
  <line x1="300" y1="310" x2="330" y2="310" stroke="#222" stroke-width="2"/>
  <polygon points="322,304 335,310 322,316" fill="#222"/>
  <line x1="570" y1="310" x2="650" y2="310" stroke="#222" stroke-width="2"/>
  <polygon points="642,304 655,310 642,316" fill="#222"/>
  <text x="680" y="315" font-family="Arial" font-size="15">Q2</text>

  <!-- FF3 -->
  <rect x="330" y="375" width="240" height="70" fill="#f3f4f6" stroke="#222" stroke-width="2"/>
  <text x="450" y="405" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold">D Flip-Flop 3</text>
  <text x="450" y="428" text-anchor="middle" font-family="Arial" font-size="15">D3 → Q3</text>
  <text x="280" y="412" text-anchor="middle" font-family="Arial" font-size="15">D3</text>
  <line x1="300" y1="410" x2="330" y2="410" stroke="#222" stroke-width="2"/>
  <polygon points="322,404 335,410 322,416" fill="#222"/>
  <line x1="570" y1="410" x2="650" y2="410" stroke="#222" stroke-width="2"/>
  <polygon points="642,404 655,410 642,416" fill="#222"/>
  <text x="680" y="415" font-family="Arial" font-size="15">Q3</text>

  <!-- Common clock -->
  <line x1="120" y1="70" x2="120" y2="450" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="110" x2="300" y2="110" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="210" x2="300" y2="210" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="310" x2="300" y2="310" stroke="#222" stroke-width="2"/>
  <line x1="120" y1="410" x2="300" y2="410" stroke="#222" stroke-width="2"/>
  <text x="85" y="260" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" transform="rotate(-90 85 260)">CLK</text>

  <!-- Reset -->
  <line x1="750" y1="70" x2="750" y2="450" stroke="#222" stroke-width="2"/>
  <line x1="750" y1="110" x2="570" y2="110" stroke="#222" stroke-width="2"/>
  <line x1="750" y1="210" x2="570" y2="210" stroke="#222" stroke-width="2"/>
  <line x1="750" y1="310" x2="570" y2="310" stroke="#222" stroke-width="2"/>
  <line x1="750" y1="410" x2="570" y2="410" stroke="#222" stroke-width="2"/>
  <text x="795" y="260" text-anchor="middle" font-family="Arial" font-size="18" font-weight="bold" transform="rotate(90 795 260)">RESET</text>
</svg>
